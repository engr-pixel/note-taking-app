<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note-Taking App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 My Notes</h1>
    </header>

    <main>
      <!-- Create Note Section -->
      <div class="create-note">
        <input
          type="text"
          id="noteTitle"
          placeholder="Note title..."
          class="input-title"
        />
        <textarea
          id="noteContent"
          placeholder="Write your note here..."
          class="textarea-content"
        ></textarea>
        <button id="createBtn" class="btn btn-primary">Create Note</button>
      </div>

      <!-- Notes List Section -->
      <div class="notes-list">
        <h2>Your Notes</h2>
        <div id="notesList" class="notes-container"></div>
      </div>
    </main>
  </div>

  <!-- Note Detail Modal -->
  <div id="noteModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle"></h2>
      <p id="modalContent"></p>
      <small id="modalDate"></small>
      <div class="modal-actions">
        <button id="editBtn" class="btn btn-secondary">Edit</button>
        <button id="deleteBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close-edit">&times;</span>
      <h2>Edit Note</h2>
      <input
        type="text"
        id="editTitle"
        placeholder="Note title..."
        class="input-title"
      />
      <textarea
        id="editContent"
        placeholder="Edit your note..."
        class="textarea-content"
      ></textarea>
      <div class="modal-actions">
        <button id="saveBtn" class="btn btn-primary">Save Changes</button>
        <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
